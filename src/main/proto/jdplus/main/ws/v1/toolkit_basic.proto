syntax = "proto3";

package jdplus.main.ws.v1;

option java_package = "jdplus.main.ws.v1";
option csharp_namespace = "JDPlus.Main.WS.V1";

import "jdplus/main/ws/v1/toolkit_messages.proto";

service TsFunctions {
  rpc GetVersion(EmptyDto) returns (VersionInfoDto);

  /* Compute (y-mean(y))/stdev(y) */
  rpc Normalize(TsFunctionRequestDto) returns (TsFunctionResponseDto);
  rpc NormalizeStream(stream TsFunctionRequestDto) returns (stream TsFunctionResponseDto);

  /* Basic descriptive statistics */
  rpc Statistics(TsFunctionRequestDto) returns (DescriptiveStatisticsResponseDto);
  rpc StatisticsStream(stream TsFunctionRequestDto) returns (stream DescriptiveStatisticsResponseDto);

  rpc Pct(PctRequestDto) returns (TsFunctionResponseDto);
  rpc PctStream(stream PctRequestDto) returns (stream TsFunctionResponseDto);

  rpc Delta(DeltaRequestDto) returns (TsFunctionResponseDto);
  rpc DeltaStream(stream DeltaRequestDto) returns (stream TsFunctionResponseDto);

  rpc Aggregate(AggregationRequestDto) returns (TsFunctionResponseDto);
  rpc AggregateStream(stream AggregationRequestDto) returns (stream TsFunctionResponseDto);

  rpc HodrickPrescott(HodrickPrescottRequestDto) returns (HodrickPrescottResponseDto);
  rpc HodrickPrescottStream(stream HodrickPrescottRequestDto) returns (stream HodrickPrescottResponseDto);

  rpc BuildTsData(BuildTsDataRequestDto) returns (BuildTsDataResponseDto);
  rpc BuildTsDataStream(stream BuildTsDataRequestDto) returns (stream BuildTsDataResponseDto);

  rpc BuildTsDataTable(BuildTsDataTableRequestDto) returns (BuildTsDataTableResponseDto);

  rpc ProcessTemporalDisaggregation(TemporalDisaggregationRequestDto) returns (TemporalDisaggregationResponseDto);

  rpc TramoForecast(TramoRequestDto) returns (TramoForecastResponseDto);
  rpc TramoForecastStream(stream TramoRequestDto) returns (stream TramoForecastResponseDto);

  rpc TramoFullProcess(TramoRequestDto) returns (TramoFullProcessResponseDto);



}
